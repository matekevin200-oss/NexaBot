name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild generated bundle
        run: node ./scripts/build-bundle.cjs
      - name: Run automated checks
        run: npm test
      - name: Check generated entry point syntax
        run: node --check index.js
