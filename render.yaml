services:
  - type: web
    name: nexabot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: BOT_OWNER_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5-mini"
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_POOL_MAX
        value: "10"
      - key: PUBLIC_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
