services:
  - type: web
    name: nexabot
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 90
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: BOT_OWNER_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5-mini"
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_RETRY_MS
        value: "60000"
      - key: DISCORD_MAX_OFFLINE_MS
        value: "180000"
      - key: STARTUP_GRACE_MS
        value: "180000"
      - key: WATCHDOG_INTERVAL_MS
        value: "15000"
      - key: INTERACTION_WINDOW_MS
        value: "10000"
      - key: INTERACTION_USER_LIMIT
        value: "18"
      - key: INTERACTION_GUILD_LIMIT
        value: "220"
      - key: TELEMETRY_RETENTION_DAYS
        value: "90"
      - key: ERROR_RETENTION_DAYS
        value: "180"
      - key: AUDIT_RETENTION_DAYS
        value: "365"
      - key: AI_HISTORY_RETENTION_DAYS
        value: "30"
      - key: PUBLIC_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
